[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trip-planner"
version = "0.1.0"
description = "Multi-agent trip planner served as a LangGraph graph."
requires-python = ">=3.11"
dependencies = [
  "langchain[mcp]==1.5.0",
  "langchain-openai==1.8.0",
  "langchain-tavily==0.2.18",
  "langgraph==1.2.22",
  "langgraph-cli[inmem]==0.4.43",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
  "httpx>=0.27",
]

[tool.setuptools]
py-modules = ["agent", "http_app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
  "ignore:.*langchain.mcp.*:UserWarning",
]
